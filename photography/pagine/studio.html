<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pietro Zanotto — Studio</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .project-row { --altezza-aperta: 500px; }

    /* COPERTINE — modifica --cover-y per scegliere il punto visibile (0%=cima, 100%=fondo) */
    .row-cami { --cover-y: 20%; }
    .row-cate  { --cover-y: 31%; }

    .project-row__img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% var(--cover-y, 50%);
    }

    /* ---- Loader ---- */
    #loader {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.6s;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader-bar-track {
      width: 200px;
      height: 1.7px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    #loader-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--testo);
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <div id="loader">
    Loading Images...
    <div id="loader-bar-track"><div id="loader-bar-fill"></div></div>
  </div>

  <header class="navbar">
    <a href="../../design/index.html" class="navbar__side navbar__side--left">Also a designer :)</a>
    <div class="navbar__center">
      <nav class="navbar__nav">
        <a href="reportage.html">Reportage</a>
        <a href="weddings.html">Weddings</a>
        <a href="studio.html" class="active">Studio</a>
      </nav>
    </div>
    <a href="mailto:pietrozanotto@hotmail.com" class="navbar__side navbar__side--right">Contact me*</a>
  </header>

  <main class="projects">

    <a class="project-row row-cami" href="studio/cami-savelli.html">
      <span class="project-row__num">#01</span>
      <span class="project-row__title">CONCRETE</span>
      <div class="project-row__img">
        <img src="../foto/studio/cami-savelli/cami-savelli-13.jpg" alt="Cami Savelli" loading="lazy" />
      </div>
      <span class="project-row__date">2026</span>
    </a>

    <a class="project-row row-cate" href="studio/cate-z.html">
      <span class="project-row__num">#02</span>
      <span class="project-row__title">ORCHESTRA</span>
      <div class="project-row__img">
        <img src="../foto/studio/cate-z/cate-z-11.jpg" alt="Cate Z" loading="lazy" />
      </div>
      <span class="project-row__date">2026</span>
    </a>

  </main>

  <footer class="footer">
    <a class="footer-mobile" href="../../design/index.html">Also a designer :)</a>
    <img src="../../logo/logo-footer.png" alt="Pietro Zanotto" height="20" />
    <a class="footer-mobile" href="mailto:pietrozanotto@hotmail.com">Contact me*</a>
  </footer>

  <script>
    document.querySelectorAll('.project-row').forEach(row => {
      const img = row.querySelector('img');
      if (!img) return;
      const setHeight = () => {
        const ratio = img.naturalHeight / img.naturalWidth;
        const w = row.querySelector('.project-row__img').offsetWidth;
        row.style.setProperty('--altezza-aperta', (w * ratio) + 'px');
      };
      img.complete ? setHeight() : img.addEventListener('load', setHeight);
    });

    /* Loader con progresso reale sulle copertine */
    (function () {
      var loader   = document.getElementById('loader');
      var fill     = document.getElementById('loader-bar-fill');
      var imgs     = Array.from(document.querySelectorAll('.project-row img'));
      var minDelay = 2000;
      var start    = Date.now();

      function setProgress(ratio) { fill.style.width = Math.round(ratio * 100) + '%'; }

      function dismiss() {
        setProgress(1);
        var remaining = Math.max(0, minDelay - (Date.now() - start));
        setTimeout(function () { loader.classList.add('done'); }, remaining);
      }

      if (!imgs.length) { dismiss(); return; }
      var total = imgs.length, loaded = 0;
      function check() { loaded++; setProgress(loaded / total); if (loaded >= total) dismiss(); }
      imgs.forEach(function (img) {
        if (img.complete && img.naturalWidth > 0) check();
        else { img.addEventListener('load', check); img.addEventListener('error', check); }
      });
    }());
  </script>

</body>
</html>
