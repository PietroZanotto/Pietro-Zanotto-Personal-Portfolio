<!DOCTYPE html>

  <title>Pietro Zanotto — Reportage</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .project-row { --altezza-aperta: 500px; }

    /* COPERTINE — modifica --cover-y per scegliere il punto visibile (0%=cima, 100%=fondo) */
    .row-mud      { --cover-y: 27%; }
    .row-wiz      { --cover-y: 50%; }
    .row-motel    { --cover-y: 36%; }
    .row-meeting  { --cover-y: 30%; }
    .row-vac      { --cover-y: 40%; }
    .row-sancarlo { --cover-y: 73%; }

    .project-row__img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% var(--cover-y, 50%);
    }

    /* ---- Loader di caricamento ---- */
    #loader {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.6s;
    }
    #loader.done {
      opacity: 0;
      pointer-events: none;
    }

    /* Barra di progresso — stile pillola come la navbar */
    #loader-bar-track {
      width: 200px;
      height: 1.7px;             /* stesso spessore dei bordi del sito */
      background: rgba(0,0,0,0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    #loader-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--testo);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <script>
    document.querySelectorAll('.project-row').forEach(row => {
      const img = row.querySelector('img');
      if (!img) return;
      const setHeight = () => {
        const ratio = img.naturalHeight / img.naturalWidth;
        const w = row.querySelector('.project-row__img').offsetWidth;
        row.style.setProperty('--altezza-aperta', (w * ratio) + 'px');
      };
      img.complete ? setHeight() : img.addEventListener('load', setHeight);
    });

    /* Loader: barra di progresso reale + minimo 2 secondi */
    (function () {
      var loader   = document.getElementById('loader');
      var fill     = document.getElementById('loader-bar-fill');
      var imgs     = Array.from(document.querySelectorAll('.project-row img'));
      var minDelay = 2000;
      var start    = Date.now();

      function setProgress(ratio) {
        fill.style.width = Math.round(ratio * 100) + '%';
      }

      function dismiss() {
        setProgress(1);
        var elapsed   = Date.now() - start;
        var remaining = Math.max(0, minDelay - elapsed);
        setTimeout(function () { loader.classList.add('done'); }, remaining);
      }

      if (!imgs.length) { dismiss(); return; }
      var total = imgs.length, loaded = 0;

      function check() {
        loaded++;
        setProgress(loaded / total);
        if (loaded >= total) dismiss();
      }

      imgs.forEach(function (img) {
        if (img.complete && img.naturalWidth > 0) { check(); }
        else { img.addEventListener('load', check); img.addEventListener('error', check); }
      });
    }());
  </script>
